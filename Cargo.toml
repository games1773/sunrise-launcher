[package]
name = "sunrise-launcher"
version = "0.2.0"
edition = "2021"
description = "Sunrise Launcher - a launcher for Horizon, the Rust rewrite of Minecraft: Java Edition 26.3"
license = "MIT"

[lib]
name = "sunrise"
path = "src/lib.rs"

[[bin]]
name = "sunrise"
path = "src/bin/sunrise/main.rs"

[[bin]]
name = "sunrise-cli"
path = "src/bin/sunrise_cli.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls", "webpki-roots"] }
sha1 = "0.10"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
dirs = "7"
rfd = "0.17"
open = "5"

[profile.release]
opt-level = 2
strip = true
